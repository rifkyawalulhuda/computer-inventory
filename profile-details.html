<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Details</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="assets/vendors/css/vendors.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/theme.min.css">
    <script src="assets/js/auth-client.js"></script>
    <script>
        if (window.AuthClient) {
            window.AuthClient.requireAuth();
            window.AuthClient.validateSession(`${window.location.protocol === "https:" ? "https:" : "http:"}//${window.location.hostname || "localhost"}:3001/api`);
        }
    </script>
    <style>
        .page-shell {
            min-height: 100vh;
            background: linear-gradient(160deg, #f8fafc 0%, #eef4ff 45%, #edf9f4 100%);
            padding: 32px 0;
        }

        .card-shadow {
            border: 0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .profile-avatar {
            width: 112px;
            height: 112px;
            object-fit: cover;
            border-radius: 999px;
            border: 3px solid #dbeafe;
        }
    </style>
</head>

<body>
    <main class="page-shell">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
                <div>
                    <h2 class="mb-1">Profile Details</h2>
                    <p class="text-muted mb-0">Anda bisa mengubah Foto Profile, Contact, Rank, dan Password (wajib isi password lama).</p>
                </div>
                <a href="index.html" class="btn btn-light border">Kembali ke Dashboard</a>
            </div>

            <div id="alertBox" class="alert d-none" role="alert"></div>

            <div class="card card-shadow">
                <div class="card-body">
                    <form id="profileForm">
                        <div class="row g-4">
                            <div class="col-md-4 col-lg-3">
                                <div class="text-center">
                                    <img id="profilePreview" class="profile-avatar mb-3" src="assets/images/avatar/1.png" alt="Profile Photo">
                                    <input type="file" class="form-control" id="profilePhotoInput" accept="image/*">
                                    <small class="text-muted d-block mt-2">Maksimal 2MB.</small>
                                </div>
                            </div>
                            <div class="col-md-8 col-lg-9">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="nameInput" class="form-label">Name</label>
                                        <input type="text" class="form-control" id="nameInput" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="emailInput" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="emailInput" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="contactInput" class="form-label">Contact</label>
                                        <input type="text" class="form-control" id="contactInput" maxlength="50" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="rankInput" class="form-label">Rank</label>
                                        <input type="text" class="form-control" id="rankInput" maxlength="50" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="currentPasswordInput" class="form-label">Password Lama</label>
                                        <input type="password" class="form-control" id="currentPasswordInput" minlength="6" maxlength="100" autocomplete="current-password" placeholder="Wajib diisi saat ganti password">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="passwordInput" class="form-label">Password Baru</label>
                                        <input type="password" class="form-control" id="passwordInput" minlength="6" maxlength="100" autocomplete="new-password" placeholder="Kosongkan jika tidak ingin mengubah">
                                        <small class="text-muted">Minimal 6 karakter.</small>
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-primary" id="submitButton">Simpan Perubahan</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = `${window.location.protocol === "https:" ? "https:" : "http:"}//${window.location.hostname || "localhost"}:3001/api`;
        const DEFAULT_AVATAR = "assets/images/avatar/1.png";

        const alertBox = document.getElementById("alertBox");
        const profileForm = document.getElementById("profileForm");
        const submitButton = document.getElementById("submitButton");
        const nameInput = document.getElementById("nameInput");
        const emailInput = document.getElementById("emailInput");
        const contactInput = document.getElementById("contactInput");
        const rankInput = document.getElementById("rankInput");
        const currentPasswordInput = document.getElementById("currentPasswordInput");
        const passwordInput = document.getElementById("passwordInput");
        const profilePhotoInput = document.getElementById("profilePhotoInput");
        const profilePreview = document.getElementById("profilePreview");

        let currentUser = null;
        let selectedProfilePhotoDataUrl = "";

        async function apiFetch(url, options = {}) {
            if (window.AuthClient) {
                return window.AuthClient.fetchWithAuth(url, options);
            }

            return fetch(url, options);
        }

        function toAbsolutePhotoUrl(relativeOrAbsolute) {
            const value = String(relativeOrAbsolute || "").trim();
            if (!value) {
                return "";
            }

            if (value.startsWith("http://") || value.startsWith("https://") || value.startsWith("data:")) {
                return value;
            }

            if (value.startsWith("/")) {
                return `${window.location.protocol === "https:" ? "https:" : "http:"}//${window.location.hostname || "localhost"}:3001${value}`;
            }

            return value;
        }

        function showAlert(message, type) {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.classList.remove("d-none");
        }

        function hideAlert() {
            alertBox.classList.add("d-none");
            alertBox.textContent = "";
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ""));
                reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
                reader.readAsDataURL(file);
            });
        }

        function getInitialPhotoFromSession() {
            if (!window.AuthClient) {
                return "";
            }

            const user = window.AuthClient.getUser() || {};
            return (
                String(user.profilePhotoUrl || "").trim()
                || String(user.profilePhotoDataUrl || "").trim()
            );
        }

        function renderForm() {
            nameInput.value = currentUser?.name || "";
            emailInput.value = currentUser?.email || "";
            contactInput.value = currentUser?.contact || "";
            rankInput.value = currentUser?.rank || "";
            currentPasswordInput.value = "";
            passwordInput.value = "";

            const sessionPhoto = selectedProfilePhotoDataUrl
                || String(currentUser?.profilePhotoUrl || "").trim()
                || getInitialPhotoFromSession();
            profilePreview.src = toAbsolutePhotoUrl(sessionPhoto) || DEFAULT_AVATAR;
        }

        async function loadProfile() {
            const response = await apiFetch(`${API_BASE}/auth/me`);
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(result.message || "Gagal memuat profile.");
            }

            currentUser = result.data || null;
            if (window.AuthClient && currentUser) {
                const prev = window.AuthClient.getUser() || {};
                window.AuthClient.setUser({
                    ...currentUser,
                    profilePhotoUrl: currentUser.profilePhotoUrl || prev.profilePhotoUrl || "",
                    profilePhotoDataUrl: prev.profilePhotoDataUrl || ""
                });
            }
        }

        async function handlePhotoChange(event) {
            hideAlert();
            const file = event.target.files && event.target.files[0];
            if (!file) {
                return;
            }

            if (!String(file.type || "").startsWith("image/")) {
                profilePhotoInput.value = "";
                showAlert("File harus berupa gambar.", "danger");
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                profilePhotoInput.value = "";
                showAlert("Ukuran foto maksimal 2MB.", "danger");
                return;
            }

            try {
                selectedProfilePhotoDataUrl = await readFileAsDataURL(file);
                profilePreview.src = selectedProfilePhotoDataUrl;
            } catch (error) {
                profilePhotoInput.value = "";
                showAlert(error.message || "Gagal memuat foto.", "danger");
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            hideAlert();

            const contact = contactInput.value.trim();
            const rank = rankInput.value.trim();
            const currentPassword = currentPasswordInput.value.trim();
            const password = passwordInput.value.trim();

            if (!contact || contact.length > 50) {
                showAlert("Contact wajib diisi (maksimal 50 karakter).", "danger");
                return;
            }

            if (!rank || rank.length > 50) {
                showAlert("Rank wajib diisi (maksimal 50 karakter).", "danger");
                return;
            }

            if (password && !currentPassword) {
                showAlert("Password lama wajib diisi untuk mengganti password.", "danger");
                return;
            }

            if (currentPassword && !password) {
                showAlert("Isi password baru untuk mengganti password.", "danger");
                return;
            }

            if (currentPassword && (currentPassword.length < 6 || currentPassword.length > 100)) {
                showAlert("Password lama tidak valid.", "danger");
                return;
            }

            if (password && (password.length < 6 || password.length > 100)) {
                showAlert("Password baru minimal 6 karakter.", "danger");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Menyimpan...";

            try {
                const response = await apiFetch(`${API_BASE}/auth/profile`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contact,
                        rank,
                        currentPassword: password ? currentPassword : undefined,
                        password: password || undefined,
                        profilePhotoDataUrl: selectedProfilePhotoDataUrl || undefined
                    })
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.message || "Gagal menyimpan profile.");
                }

                const updatedUser = result.data || {};
                if (window.AuthClient) {
                    const previous = window.AuthClient.getUser() || {};
                    window.AuthClient.setUser({
                        ...previous,
                        ...updatedUser,
                        profilePhotoUrl: updatedUser.profilePhotoUrl || previous.profilePhotoUrl || "",
                        profilePhotoDataUrl: selectedProfilePhotoDataUrl || previous.profilePhotoDataUrl || ""
                    });
                }

                currentUser = updatedUser;
                selectedProfilePhotoDataUrl = "";
                currentPasswordInput.value = "";
                passwordInput.value = "";
                renderForm();
                showAlert("Profile berhasil diperbarui.", "success");
            } catch (error) {
                showAlert(error.message || "Gagal menyimpan profile.", "danger");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Simpan Perubahan";
            }
        }

        async function initialize() {
            try {
                hideAlert();
                selectedProfilePhotoDataUrl = getInitialPhotoFromSession();
                await loadProfile();
                renderForm();
            } catch (error) {
                showAlert(error.message || "Gagal memuat profile.", "danger");
            }
        }

        profilePhotoInput.addEventListener("change", handlePhotoChange);
        profileForm.addEventListener("submit", handleSubmit);
        initialize();
    </script>
</body>

</html>
