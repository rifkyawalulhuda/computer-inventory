<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Computer Inventory</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="assets/vendors/css/vendors.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/theme.min.css">
    <script src="assets/js/auth-client.js"></script>
    <style>
        :root {
            --corp-blue-900: #0a2f6d;
            --corp-blue-800: #123f88;
            --corp-blue-700: #1e56ad;
            --corp-blue-100: #e6efff;
            --corp-text: #0f172a;
        }

        .login-shell {
            min-height: 100vh;
            padding: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 14% 14%, rgba(135, 186, 255, 0.32) 0%, rgba(135, 186, 255, 0) 42%),
                radial-gradient(circle at 86% 86%, rgba(94, 145, 255, 0.2) 0%, rgba(94, 145, 255, 0) 40%),
                linear-gradient(145deg, #f2f7ff 0%, #dfeeff 55%, #f6f9ff 100%);
        }

        .login-layout {
            width: min(980px, 100%);
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(9, 30, 66, 0.2);
            background: #fff;
        }

        .login-hero {
            padding: 48px 42px;
            background:
                radial-gradient(circle at 18% 16%, rgba(137, 195, 255, 0.22) 0%, rgba(137, 195, 255, 0) 38%),
                radial-gradient(circle at 84% 84%, rgba(123, 174, 255, 0.2) 0%, rgba(123, 174, 255, 0) 44%),
                linear-gradient(155deg, #133a83 0%, #1f58aa 48%, #3f82da 100%);
            color: #fff;
            position: relative;
        }

        .login-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(115deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0) 56%),
                radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 36%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .company-logo {
            width: 132px;
            height: auto;
            display: block;
            margin-bottom: 18px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.28));
        }

        .company-name {
            margin: 0;
            font-size: 1.34rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.35;
            color: #f7fbff;
            text-shadow: 0 2px 10px rgba(8, 35, 82, 0.28);
        }

        .company-subtitle {
            margin: 12px 0 0;
            color: rgba(236, 246, 255, 0.92);
            font-size: 0.98rem;
        }

        .hero-footer {
            margin-top: 24px;
            color: rgba(226, 239, 255, 0.9);
            font-size: 0.9rem;
        }

        .login-card {
            width: 100%;
            border-radius: 0;
            border: 0;
            box-shadow: none;
        }

        .login-card .card-body {
            padding: 46px 40px;
        }

        .login-title {
            margin: 0;
            color: var(--corp-text);
            font-weight: 800;
            font-size: 1.36rem;
        }

        .login-subtitle {
            margin-top: 8px;
            color: #475569;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 700;
            color: #334155;
        }

        .form-control {
            border-radius: 10px;
            border-color: #cbd5e1;
            min-height: 44px;
        }

        .form-control:focus {
            border-color: #7eaaf4;
            box-shadow: 0 0 0 0.2rem rgba(30, 86, 173, 0.16);
        }

        .password-field-wrap {
            position: relative;
        }

        .password-field-wrap .form-control {
            padding-right: 46px;
        }

        .password-toggle-btn {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #64748b;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
        }

        .password-toggle-btn:hover {
            color: #1e56ad;
        }

        .password-toggle-btn:focus-visible {
            outline: 2px solid #7eaaf4;
            outline-offset: 2px;
            border-radius: 6px;
        }

        .password-toggle-btn i {
            font-size: 16px;
            line-height: 1;
        }
        .form-check-label {
            color: #475569;
        }

        .btn-primary {
            background: linear-gradient(130deg, var(--corp-blue-700), var(--corp-blue-900));
            border: 0;
            border-radius: 10px;
            min-height: 44px;
            font-weight: 700;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background: linear-gradient(130deg, #1a4d9e, #082759);
        }

        @media (max-width: 920px) {
            .login-layout {
                grid-template-columns: 1fr;
            }

            .login-hero {
                padding: 34px 30px;
            }

            .company-logo {
                width: 104px;
                margin-bottom: 12px;
            }

            .login-card .card-body {
                padding: 34px 28px;
            }
        }

        @media (max-width: 575px) {
            .login-shell {
                padding: 12px;
            }

            .login-card .card-body {
                padding: 26px 18px;
            }
        }
    </style>
</head>

<body>
    <main class="login-shell">
        <div class="login-layout">
            <section class="login-hero">
                <div class="hero-content">
                    <img src="assets/images/logo/sankyu-logo.png" alt="Logo PT SANKYU INDONESIA INTERNATIONAL" class="company-logo">
                    <h1 class="company-name">PT. SANKYU INDONESIA INTERNATIONAL</h1>
                    <p class="company-subtitle">Aplikasi Manajemen Inventaris Komputer</p>
                    <p class="hero-footer">Sistem terpusat untuk pengelolaan aset perangkat perusahaan secara terstruktur dan akurat.</p>
                </div>
            </section>

            <div class="card login-card">
                <div class="card-body">
                    <h2 class="login-title">Login Sistem</h2>
                    <p class="login-subtitle">Masukkan akun Anda untuk melanjutkan.</p>

                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="email@company.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="password-field-wrap">
                                <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                                <button type="button" class="password-toggle-btn" id="passwordToggleButton" aria-label="Tampilkan password" aria-pressed="false">
                                    <i class="feather-eye" id="passwordToggleIcon" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" value="1" id="rememberMe" checked>
                            <label class="form-check-label" for="rememberMe">
                                Tetap login di perangkat ini
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="submitButton">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = `${window.location.protocol === "https:" ? "https:" : "http:"}//${window.location.hostname || "localhost"}:3001/api`;
        const loginForm = document.getElementById("loginForm");
        const alertBox = document.getElementById("alertBox");
        const submitButton = document.getElementById("submitButton");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const passwordToggleButton = document.getElementById("passwordToggleButton");
        const passwordToggleIcon = document.getElementById("passwordToggleIcon");
        const rememberMeInput = document.getElementById("rememberMe");

        function showAlert(message, type) {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.classList.remove("d-none");
        }

        function hideAlert() {
            alertBox.classList.add("d-none");
            alertBox.textContent = "";
        }

        function setPasswordVisibility(isVisible) {
            passwordInput.type = isVisible ? "text" : "password";
            passwordToggleButton.setAttribute("aria-pressed", isVisible ? "true" : "false");
            passwordToggleButton.setAttribute("aria-label", isVisible ? "Sembunyikan password" : "Tampilkan password");
            passwordToggleIcon.className = isVisible ? "feather-eye-off" : "feather-eye";
        }

        function getNextPath() {
            const params = new URLSearchParams(window.location.search);
            const next = String(params.get("next") || "").trim();
            if (window.AuthClient && window.AuthClient.isSafeInternalPath(next)) {
                return next;
            }

            return "index.html";
        }

        async function submitLogin(event) {
            event.preventDefault();
            hideAlert();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const rememberMe = rememberMeInput.checked;

            if (!email || !password) {
                showAlert("Email dan password wajib diisi.", "danger");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Memproses...";

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.message || "Login gagal.");
                }

                const token = result?.data?.token;
                const user = result?.data?.user;
                if (!window.AuthClient || !token || !user) {
                    throw new Error("Sesi login tidak valid.");
                }

                const previousUser = window.AuthClient.getUser() || {};
                const previousEmail = String(previousUser.email || "").trim().toLowerCase();
                const nextEmail = String(user.email || "").trim().toLowerCase();
                if (previousEmail && nextEmail && previousEmail === nextEmail) {
                    if (!user.profilePhotoUrl && previousUser.profilePhotoUrl) {
                        user.profilePhotoUrl = previousUser.profilePhotoUrl;
                    }

                    if (!user.profilePhotoDataUrl && previousUser.profilePhotoDataUrl) {
                        user.profilePhotoDataUrl = previousUser.profilePhotoDataUrl;
                    }
                }

                window.AuthClient.setSession(token, user, rememberMe);
                window.location.href = getNextPath();
            } catch (error) {
                showAlert(error.message || "Login gagal.", "danger");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Login";
            }
        }

        if (window.AuthClient) {
            window.AuthClient.redirectIfAuthenticated("index.html");
        }

        passwordToggleButton.addEventListener("click", () => {
            const willShowPassword = passwordInput.type === "password";
            setPasswordVisibility(willShowPassword);
        });

        setPasswordVisibility(false);
        loginForm.addEventListener("submit", submitLogin);
    </script>
</body>

</html>
