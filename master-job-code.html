<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Master Job Code</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="assets/vendors/css/vendors.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/theme.min.css">
    <script src="assets/js/auth-client.js"></script>
    <script>
        if (window.AuthClient) {
            if (!window.AuthClient.requireRole("admin", "index.html")) {
                // Redirect handled by AuthClient.
            } else {
                window.AuthClient.validateSession(`${window.location.protocol === "https:" ? "https:" : "http:"}//${window.location.hostname || "localhost"}:3001/api`);
            }
        }
    </script>
    <style>
        .page-shell {
            min-height: 100vh;
            background: linear-gradient(160deg, #f8fafc 0%, #eef4ff 45%, #edf9f4 100%);
            padding: 32px 0;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: #475569;
            margin-bottom: 0;
        }

        .card-shadow {
            border: 0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .table-action-group .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 30px;
            padding: 0;
        }
        .table-action-group .btn i {
            font-size: 14px;
        }

        .form-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
            z-index: 1050;
        }

        .form-modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .form-modal {
            width: min(560px, 100%);
            max-height: calc(100vh - 32px);
            overflow: hidden;
        }

        .form-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-modal-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
        }

        .form-modal-close {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #334155;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .form-modal-close i {
            font-size: 16px;
        }

        .form-modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        .confirm-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease;
            z-index: 1060;
        }

        .confirm-modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .confirm-modal {
            width: min(430px, calc(100vw - 32px));
            margin: 48px auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.3);
            overflow: hidden;
        }

        .confirm-modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .confirm-modal-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .confirm-modal-body {
            padding: 14px 16px;
            color: #475569;
        }

        .confirm-modal-footer {
            padding: 0 16px 16px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .confirm-modal-close {
            width: 32px;
            height: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            color: #475569;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main class="page-shell">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
                <div>
                    <h1 class="page-title">Master Job Code</h1>
                    <p class="page-subtitle">Menyimpan data Job Code, Site Name, Address, dan Telp. Number.</p>
                </div>
            </div>

            <div id="alertBox" class="alert d-none" role="alert"></div>

            
            <div class="card card-shadow">
                <div class="card-body">
                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                        <h5 class="card-title mb-0">Data Master Job Code</h5>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-primary" id="addDataButton">
                                <i class="feather-plus me-1"></i>Tambah Data
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-primary" id="refreshButton">Refresh</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Job Code</th>
                                    <th>Site Name</th>
                                    <th>Address</th>
                                    <th>Telp. Number</th>
                                    <th style="width: 180px;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-4">Loading data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="form-modal-overlay" id="formModalOverlay" aria-hidden="true">
        <div class="card card-shadow form-modal" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
            <div class="form-modal-header">
                <h5 class="form-modal-title" id="formModalTitle">Tambah Master Job Code</h5>
                <button type="button" class="form-modal-close" id="formCloseButton" aria-label="Tutup Form">
                    <i class="feather-x"></i>
                </button>
            </div>
            <div class="form-modal-body">
                <form id="masterJobCodeForm">
                    <input type="hidden" id="rowId">

                    <div class="mb-3">
                        <label for="jobCode" class="form-label">Job Code</label>
                        <input type="text" class="form-control" id="jobCode" maxlength="5" placeholder="Contoh: CLC" required>
                        <small class="text-muted">Maksimal 5 huruf.</small>
                    </div>

                    <div class="mb-3">
                        <label for="siteName" class="form-label">Site Name</label>
                        <input type="text" class="form-control" id="siteName" maxlength="30" placeholder="Contoh: Cikarang Warehouse" required>
                        <small class="text-muted">Maksimal 30 karakter.</small>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" rows="3" placeholder="Alamat site" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Telp. Number</label>
                        <input type="text" class="form-control" id="phoneNumber" maxlength="30" placeholder="Contoh: +62 21 5555 1234" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100" id="submitButton">Simpan</button>
                        <button type="button" class="btn btn-light border w-100" id="cancelButton">Batal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="confirm-modal-overlay" id="confirmModalOverlay" aria-hidden="true">
        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
            <div class="confirm-modal-header">
                <h5 class="confirm-modal-title" id="confirmModalTitle">Konfirmasi Hapus</h5>
                <button type="button" class="confirm-modal-close" id="confirmCloseButton" aria-label="Tutup Konfirmasi">
                    <i class="feather-x"></i>
                </button>
            </div>
            <div class="confirm-modal-body">
                <p class="mb-0" id="confirmModalMessage">Apakah Anda yakin ingin menghapus data ini?</p>
            </div>
            <div class="confirm-modal-footer">
                <button type="button" class="btn btn-light border" id="confirmCancelButton">Batal</button>
                <button type="button" class="btn btn-danger" id="confirmConfirmButton">
                    <i class="feather-trash-2 me-1"></i>Hapus
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = `${window.location.protocol === "https:" ? "https:" : "http:"}//${window.location.hostname || "localhost"}:3001/api`;
        async function apiFetch(url, options = {}) {
            if (window.AuthClient) {
                return window.AuthClient.fetchWithAuth(url, options);
            }

            return fetch(url, options);
        }
        const tableBody = document.getElementById("tableBody");
        const alertBox = document.getElementById("alertBox");
        const form = document.getElementById("masterJobCodeForm");
        const rowId = document.getElementById("rowId");
        const jobCode = document.getElementById("jobCode");
        const siteName = document.getElementById("siteName");
        const address = document.getElementById("address");
        const phoneNumber = document.getElementById("phoneNumber");
        const submitButton = document.getElementById("submitButton");
        const cancelButton = document.getElementById("cancelButton");
        const refreshButton = document.getElementById("refreshButton");
        const addDataButton = document.getElementById("addDataButton");
        const formModalOverlay = document.getElementById("formModalOverlay");
        const formModalTitle = document.getElementById("formModalTitle");
        const formCloseButton = document.getElementById("formCloseButton");
        const confirmModalOverlay = document.getElementById("confirmModalOverlay");
        const confirmModalTitle = document.getElementById("confirmModalTitle");
        const confirmModalMessage = document.getElementById("confirmModalMessage");
        const confirmCloseButton = document.getElementById("confirmCloseButton");
        const confirmCancelButton = document.getElementById("confirmCancelButton");
        const confirmConfirmButton = document.getElementById("confirmConfirmButton");

        function showAlert(message, type) {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.classList.remove("d-none");
        }

        function hideAlert() {
            alertBox.classList.add("d-none");
            alertBox.textContent = "";
        }

        function resetForm() {
            rowId.value = "";
            form.reset();
            submitButton.textContent = "Simpan";
            formModalTitle.textContent = "Tambah Master Job Code";
        }

        function openFormModal(title = "Tambah Master Job Code") {
            formModalTitle.textContent = title;
            formModalOverlay.classList.add("open");
            formModalOverlay.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
            window.setTimeout(() => jobCode.focus(), 0);
        }

        function closeFormModal() {
            formModalOverlay.classList.remove("open");
            formModalOverlay.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";
        }

        let confirmResolve = null;

        function openConfirmModal(options) {
            const settings = typeof options === "string"
                ? { message: options }
                : (options || {});

            confirmModalTitle.textContent = settings.title || "Konfirmasi";
            confirmModalMessage.textContent = settings.message || "Apakah Anda yakin?";

            const confirmText = settings.confirmText || "Lanjutkan";
            const confirmIcon = settings.confirmIcon
                ? "<i class=\"" + settings.confirmIcon + " me-1\"></i>"
                : "";
            confirmConfirmButton.className = "btn " + (settings.confirmClass || "btn-primary");
            confirmConfirmButton.innerHTML = confirmIcon + confirmText;

            confirmModalOverlay.classList.add("open");
            confirmModalOverlay.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";

            return new Promise((resolve) => {
                confirmResolve = resolve;
            });
        }

        function closeConfirmModal(confirmed = false) {
            confirmModalOverlay.classList.remove("open");
            confirmModalOverlay.setAttribute("aria-hidden", "true");
            if (confirmResolve) {
                confirmResolve(confirmed);
                confirmResolve = null;
            }
            document.body.style.overflow = formModalOverlay.classList.contains("open") ? "hidden" : "";
        }

        function validateInput() {
            const payload = {
                code: jobCode.value.trim().toUpperCase(),
                siteName: siteName.value.trim(),
                address: address.value.trim(),
                phoneNumber: phoneNumber.value.trim()
            };

            if (!/^[A-Z]{1,5}$/.test(payload.code)) {
                throw new Error("Job Code wajib 1-5 huruf (A-Z).");
            }

            if (payload.siteName.length < 1 || payload.siteName.length > 30) {
                throw new Error("Site Name wajib diisi maksimal 30 karakter.");
            }

            if (payload.address.length < 1) {
                throw new Error("Address wajib diisi.");
            }

            if (payload.phoneNumber.length < 1 || payload.phoneNumber.length > 30) {
                throw new Error("Telp. Number wajib diisi maksimal 30 karakter.");
            }

            return payload;
        }

        function formatText(value) {
            return value ? String(value) : "-";
        }

        function renderRows(rows) {
            if (!rows.length) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">Belum ada data.</td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = rows.map((row, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><span class="badge bg-light text-dark border">${formatText(row.code)}</span></td>
                    <td>${formatText(row.siteName)}</td>
                    <td>${formatText(row.address)}</td>
                    <td>${formatText(row.phoneNumber)}</td>
                    <td>
                        <div class="btn-group btn-group-sm table-action-group" role="group" aria-label="Aksi Data">
                            <button type="button" class="btn btn-light border text-primary" data-action="edit" data-id="${row.id}" title="Edit">
                                <i class="feather-edit-2"></i>
                            </button>
                            <button type="button" class="btn btn-light border text-danger" data-action="delete" data-id="${row.id}" title="Hapus">
                                <i class="feather-trash-2"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join("");
        }

        async function loadRows() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-muted py-4">Loading data...</td>
                </tr>
            `;

            try {
                const response = await apiFetch(`${API_BASE}/master-job-codes`);
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.message || "Gagal mengambil data.");
                }
                renderRows(result.data || []);
            } catch (error) {
                showAlert(error.message, "danger");
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger py-4">Gagal memuat data.</td>
                    </tr>
                `;
            }
        }

        async function submitForm(event) {
            event.preventDefault();
            hideAlert();

            try {
                const payload = validateInput();
                const id = rowId.value;
                const isEdit = Boolean(id);

                if (isEdit) {
                    const yes = await openConfirmModal({
                        title: "Konfirmasi Update",
                        message: "Update data ini?",
                        confirmText: "Update",
                        confirmClass: "btn-primary",
                        confirmIcon: "feather-check"
                    });
                    if (!yes) {
                        return;
                    }
                }

                const response = await apiFetch(
                    isEdit ? `${API_BASE}/master-job-codes/${id}` : `${API_BASE}/master-job-codes`,
                    {
                        method: isEdit ? "PUT" : "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    }
                );

                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.message || "Gagal menyimpan data.");
                }

                showAlert(isEdit ? "Data berhasil diupdate." : "Data berhasil disimpan.", "success");
                resetForm();
                closeFormModal();
                await loadRows();
            } catch (error) {
                showAlert(error.message, "danger");
            }
        }

        async function deleteRow(id) {
            const yes = await openConfirmModal({
                title: "Konfirmasi Hapus",
                message: "Hapus data ini?",
                confirmText: "Hapus",
                confirmClass: "btn-danger",
                confirmIcon: "feather-trash-2"
            });
            if (!yes) return;

            hideAlert();

            try {
                const response = await apiFetch(`${API_BASE}/master-job-codes/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(result.message || "Gagal menghapus data.");
                }

                showAlert("Data berhasil dihapus.", "success");
                resetForm();
                await loadRows();
            } catch (error) {
                showAlert(error.message, "danger");
            }
        }

        async function editRow(id) {
            try {
                const response = await apiFetch(`${API_BASE}/master-job-codes`);
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.message || "Gagal mengambil data.");
                }

                const row = (result.data || []).find((item) => String(item.id) === String(id));
                if (!row) {
                    throw new Error("Data tidak ditemukan.");
                }

                rowId.value = row.id;
                jobCode.value = row.code || "";
                siteName.value = row.siteName || "";
                address.value = row.address || "";
                phoneNumber.value = row.phoneNumber || "";
                submitButton.textContent = "Update";
                openFormModal("Edit Master Job Code");
            } catch (error) {
                showAlert(error.message, "danger");
            }
        }

        tableBody.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;

            const { action, id } = button.dataset;
            if (!id) return;

            if (action === "edit") {
                editRow(id);
            }
            if (action === "delete") {
                deleteRow(id);
            }
        });

        jobCode.addEventListener("input", () => {
            jobCode.value = jobCode.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 5);
        });

        siteName.addEventListener("input", () => {
            siteName.value = siteName.value.slice(0, 30);
        });

        phoneNumber.addEventListener("input", () => {
            phoneNumber.value = phoneNumber.value.slice(0, 30);
        });

        form.addEventListener("submit", submitForm);
        cancelButton.addEventListener("click", () => {
            hideAlert();
            resetForm();
            closeFormModal();
        });
        addDataButton.addEventListener("click", () => {
            hideAlert();
            resetForm();
            openFormModal("Tambah Master Job Code");
        });
        formCloseButton.addEventListener("click", () => {
            hideAlert();
            resetForm();
            closeFormModal();
        });
        formModalOverlay.addEventListener("click", (event) => {
            if (event.target === formModalOverlay) {
                hideAlert();
                resetForm();
                closeFormModal();
            }
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && confirmModalOverlay.classList.contains("open")) {
                closeConfirmModal(false);
                return;
            }

            if (event.key === "Escape" && formModalOverlay.classList.contains("open")) {
                hideAlert();
                resetForm();
                closeFormModal();
            }
        });
        confirmCloseButton.addEventListener("click", () => closeConfirmModal(false));
        confirmCancelButton.addEventListener("click", () => closeConfirmModal(false));
        confirmConfirmButton.addEventListener("click", () => closeConfirmModal(true));
        confirmModalOverlay.addEventListener("click", (event) => {
            if (event.target === confirmModalOverlay) {
                closeConfirmModal(false);
            }
        });
        refreshButton.addEventListener("click", loadRows);

        resetForm();
        closeFormModal();
        loadRows();
    </script>
</body>

</html>
